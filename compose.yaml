
services:
  api:
    build: .
    ports:
      - "8002:8000"
    volumes:
      - ./:/app
    environment:
      DATABASE_PATH: /app/data/practice.db
      WATCHFILES_FORCE_POLLING: "true"
      POSTGRES_HOST: db
      POSTGRES_DB: fitness_db
      POSTGRES_USER: fitness
      POSTGRES_PASSWORD: fitness_dev_password

    command: python -m uvicorn database_practice:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  tests:
    build:
      context: .
      dockerfile: Dockerfile.test
    environment:
      API_URL: http://api-test:8000
    depends_on:
      - api-test
    profiles:
      - testing
      
  api-test:
    build: .
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: fitness_test_db
      POSTGRES_USER: fitness
      POSTGRES_PASSWORD: fitness_dev_password
    command: python -m uvicorn database_practice:app --host 0.0.0.0 --port 8000
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - testing


  frontend:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./htmlstuff.html:/usr/share/nginx/html/htmlstuff.html:ro
      - ./script.js:/usr/share/nginx/html/script.js:ro
      - ./style.css:/usr/share/nginx/html/style.css:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    restart: unless-stopped
 
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: fitness
      POSTGRES_PASSWORD: fitness_dev_password
      POSTGRES_DB: fitness_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-test-db.sh:/docker-entrypoint-initdb.d/init-test-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitness -d fitness_db"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
volumes:
  postgres_data:
  