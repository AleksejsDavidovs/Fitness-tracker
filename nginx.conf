
server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index htmlstuff.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
