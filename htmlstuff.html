<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>My Gym</title>
        <meta name="description" content="Log your gym sets and track your body weight.">
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <main class="app">
            <nav class="menu">
                <button class="menu-button active" data-page="trackerPage">
                    Tracker
                </button>

                <button class="menu-button" data-page="statisticsPage">
                    Statistics
                </button>
            </nav>

            <section id="trackerPage" class="page">
                <h1>Workout Tracker</h1>
                <p>Add your first exercise</p>

                <div class="form-card">
                    <div class="exercise-manager">
                        <h2>Manage exercises</h2>

                        <div class="exercise-manager-fields">
                            <input
                                id="newExerciseName"
                                type="text"
                                placeholder="Exercise name"
                            >

                            <select id="newMuscleGroup">
                                <option value="">Muscle group</option>
                                <option value="Chest">Chest</option>
                                <option value="Back">Back</option>
                                <option value="Legs">Legs</option>
                                <option value="Shoulders">Shoulders</option>
                                <option value="Biceps">Biceps</option>
                                <option value="Triceps">Triceps</option>
                                <option value="Core">Core</option>
                                <option value="Other">Other</option>
                            </select>

                            <button id="createExerciseButton" type="button">
                                Create exercise
                            </button>
                            <button id="cancelExerciseEdit" type="button" hidden>
                                Cancel
                            </button>
                        </div>

                        <p id="exerciseError" class="error-message"></p>
                        <button
                            id="toggleExerciseCatalog"
                            type="button"
                            aria-expanded="false"
                            aria-controls="exerciseCatalog"
                        >
                            Show exercises
                        </button>

                        <div id="exerciseCatalog" hidden></div>
                    </div>

                    <div class="workout-form">
                        <h2>Log a set</h2>

                        <div class="workout-fields">
                            <select id="exerciseInput" aria-label="Exercise">
                                <option value="">Select exercise</option>
                            </select>

                            <input id="weightInput" type="number" placeholder="Weight, kg">
                            <input id="repsInput" type="number" placeholder="Reps">
                        </div>

                        <button id="addButton" type="button">Add set</button>
                        <button id="cancelButton" type="button">Cancel</button>
                        <p id="formError" class="error-message"></p>
                    </div>
                </div>

                <div id="exerciseContainer"></div>
            </section>

            <section id="statisticsPage" class="page hidden">
                <h1>Statistics</h1>
                <div class="statistics-card">
                    <h2>Body weight</h2>

                    <div class="weight-form">
                        <input
                            id="bodyWeightInput"
                            type="number"
                            step="0.1"
                            placeholder="Body weight, kg"
                            aria-label="Body weight, kg"
                        >

                        <button id="addWeightButton">
                            Save weight
                        </button>
                    </div>

                    <p id="weightError" class="error-message"></p>

                    <div class="chart-container">
                        <canvas id="bodyWeightChart" aria-label="Body weight chart" role="img"></canvas>
                    </div>

                    <div id="weightHistory"></div>
                </div>

                <div class="statistics-card">
                    <h2>Exercise progress</h2>

                    <select id="exerciseSelect" aria-label="Exercise">
                        <option value="">Select exercise</option>
                    </select>

                    <p class="muted-note">Your exercise graph will be here.</p>
                </div>
            </section>

        </main>
        <div id="deleteModal" class="modal-overlay" hidden>
            <div class="modal-content" role="dialog"
                aria-modal="true" aria-labelledby="deleteModalTitle">

                <h2 id="deleteModalTitle">Delete exercise?</h2>
                <p id="deleteModalMessage"></p>

                <div class="modal-actions">
                    <button id="cancelDeleteButton" type="button">Cancel</button>
                    <button id="confirmDeleteButton" type="button">Delete</button>
                </div>
            </div>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
        <script src="script.js"></script>
    </body>
</html>
